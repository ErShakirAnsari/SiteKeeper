name: Build & Release Extension

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Determine trigger type, channel & version
        id: vars
        run: |
          BASE_VERSION=$(node -p "require('./extension/manifest.json').version")
          BUILD="${{ github.run_number }}"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            TAG_VERSION="${TAG#v}"

            if ! [[ "$TAG_VERSION" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
              echo "Tag '$TAG' isn't a valid Chrome Web Store version — expected e.g. v1.2.3 (up to 4 numeric segments)." >&2
              exit 1
            fi

            IS_TAG="true"
            CHANNEL="production"
            PRERELEASE="false"
            VERSION="$TAG_VERSION"
            RELEASE_TAG="$TAG"
          else
            IS_TAG="false"
            VERSION="${BASE_VERSION}.${BUILD}"

            if [ "${{ github.ref_name }}" = "master" ] || [ "${{ github.ref_name }}" = "main" ]; then
              CHANNEL="production"
              PRERELEASE="false"
            else
              CHANNEL="beta"
              PRERELEASE="true"
            fi
            RELEASE_TAG="v${VERSION}-${CHANNEL}"
          fi

          echo "is_tag=${IS_TAG}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Stamp manifest version for this build
        run: |
          node -e "
            const fs = require('fs');
            const path = './extension/manifest.json';
            const m = JSON.parse(fs.readFileSync(path));
            m.version = '${{ steps.vars.outputs.version }}';
            if ('${{ steps.vars.outputs.channel }}' === 'beta') {
              m.name = m.name + ' (Beta)';
            }
            fs.writeFileSync(path, JSON.stringify(m, null, 2));
          "

      - name: Package extension
        id: package
        run: |
          ZIP_NAME="sitekeeper-${{ steps.vars.outputs.channel }}-${{ steps.vars.outputs.version }}.zip"
          cd extension && zip -r "../$ZIP_NAME" . -x "*.DS_Store" && cd ..
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.release_tag }}
          name: "${{ steps.vars.outputs.channel == 'production' && 'Release' || 'Beta' }} v${{ steps.vars.outputs.version }}"
          prerelease: ${{ steps.vars.outputs.prerelease }}
          files: ${{ steps.package.outputs.zip_name }}

      # Only a pushed tag (e.g. `git tag v1.2.3 && git push origin v1.2.3`)
      # publishes to the Chrome Web Store. Plain branch pushes — including
      # master — only produce the GitHub build/release above.
      - name: Publish to Chrome Web Store
        if: steps.vars.outputs.is_tag == 'true'
        env:
          CHROME_SERVICE_ACCOUNT_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_KEY }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: node scripts/publish-chrome-webstore.js "${{ steps.package.outputs.zip_name }}"
